security:
  - BearerAuth: []
components:
  schemas:
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: '不正だった項目名（例: "title"）。'
        code:
          type: string
          description: '機械可読なエラーコード（例: "required" / "too_long" / "blank"）。'
        message:
          type: string
          description: '人間可読な理由（例: "title must not be blank"）。'
      description: バリデーション失敗の項目単位詳細。
    TodoCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          pattern: \S
        description:
          type: string
          maxLength: 1024
          default: ''
      description: |-
        作成リクエスト（POST /todos）。
        `completed` は意図的に含めない → 送られても無視され、サーバは常に false を設定。
        id / created_at / updated_at はサーバ採番のため存在しない。
    TodoRead:
      type: object
      required:
        - id
        - title
        - description
        - completed
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: サーバ採番の UUID v4（読み取り専用）。
        title:
          type: string
          minLength: 1
          maxLength: 256
          pattern: \S
          description: タイトル。1〜256 文字、空白のみは不可。
        description:
          type: string
          maxLength: 1024
          description: 説明（任意）。最大 1024 文字。既定は空文字。
        completed:
          type: boolean
          description: 完了フラグ。作成時は常に false。
        created_at:
          type: string
          format: date-time
          description: 作成日時（サーバ管理・読み取り専用）。
        updated_at:
          type: string
          format: date-time
          description: 更新日時（サーバ管理・読み取り専用）。
      description: 読み取り時の Todo 表現（id / タイムスタンプを含む完全形）。
    TodoUpdate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          pattern: \S
        description:
          type: string
          maxLength: 1024
          default: ''
        completed:
          type: boolean
          description: 未指定時は false として置換。
          default: false
      description: |-
        全項目置換リクエスト（PUT /todos/{id}）。
        `completed` は更新でのみ変更可能。id / タイムスタンプは含めない。
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: http://localhost:8080
    description: ローカル開発
    variables: {}
