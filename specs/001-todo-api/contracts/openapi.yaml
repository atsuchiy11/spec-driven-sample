      description: Todo を作成する。`completed` はリクエストにあっても無視され false になる。
      parameters: []
      responses:
        '201':
          description: 201 Created。Location ヘッダと本体を返す。
          headers:
            Location:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoRead'
        '400':
          description: |-
            RFC 7807 準拠のエラー本体。Status はステータスコードのリテラル型。
            `@error` によりエミッタは失敗レスポンスとして扱う。
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                properties:
                  type:
                    type: string
                    description: 問題の種類を示す URI。既定は about:blank。
                    default: about:blank
                  title:
                    type: string
                    description: 問題種別の短い要約。
                  status:
                    type: integer
                    format: int32
                    description: HTTP ステータスコード。
                  detail:
                    type: string
                    description: この発生に固有の詳細説明。
                  instance:
                    type: string
                    description: 発生箇所を示す URI 参照（任意）。
